[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qortium-cli"
version = "1.0.1"
description = "A colorful, workflow-focused command-line client for Qortium"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "bcrypt>=4.1.0",
  "cryptography>=42.0.0",
  "requests>=2.31.0",
  "rich>=13.0",
  "terminaltexteffects>=0.15.0,<0.16",
  "textual>=8.2.0,<9",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = ["build>=1.2", "pyinstaller>=6.0"]

[project.scripts]
qortium-cli = "qortium_cli.entrypoint:main"
qortium-submit-tx = "qortium_cli.tx_submitter:main"
qortium-build-tx = "qortium_cli.tx_builder:main"

[tool.setuptools.packages.find]
include = ["qortium_cli*"]

[tool.setuptools.package-data]
"qortium_cli.assets" = ["*.txt"]
