name: Build Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Linux binary
        run: |
          chmod +x scripts/build_linux_binary.sh
          export INSTALL_DEPS=1
          ./scripts/build_linux_binary.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: qortium-cli-linux
          path: dist/qortium-cli

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows executable
        shell: pwsh
        run: ./scripts/build_windows_exe.ps1 -InstallDeps

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: qortium-cli-windows
          path: dist/qortium-cli.exe

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: qortium-cli-linux
          path: release/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: qortium-cli-windows
          path: release/windows

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/linux/qortium-cli
            release/windows/qortium-cli.exe
