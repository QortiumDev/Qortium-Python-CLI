name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: qortium-cli-linux
            path: dist/qortium-cli-linux
            binary: qortium-cli-linux
            archive: dist/qortium-cli-linux-x86_64.tar.gz
          - os: windows-latest
            artifact: qortium-cli-windows
            path: dist/qortium-cli-windows.exe
            binary: qortium-cli-windows.exe
            archive: dist/qortium-cli-windows-x86_64.zip
          - os: macos-latest
            artifact: qortium-cli-macos-arm64
            path: dist/qortium-cli-macos
            binary: qortium-cli-macos
            archive: dist/qortium-cli-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install ".[build]"

      - name: Build standalone executable
        run: python scripts/build_binary.py

      - name: Smoke test executable
        run: python -c "import subprocess; subprocess.run([r'${{ matrix.path }}', '--self-check'], check=True)"
        env:
          QORTIUM_CLI_MOTION: "off"

      - name: Package Linux or macOS executable
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.archive }}" -C dist "${{ matrix.binary }}"

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath "${{ matrix.path }}" -DestinationPath "${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v6

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: qortium-cli-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum qortium-cli-* > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Qortium CLI ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          make_latest: true
          fail_on_unmatched_files: true
          files: release/*
